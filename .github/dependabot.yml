version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/SAG/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/SAG/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/SAG/apps/api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/SAG/apps/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
