name: SAG operator authorization
on:
  pull_request:
    paths:
      - 'SAG/apps/api/**'
      - '.github/workflows/sag-operator.yml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SAG/apps/api
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -q
