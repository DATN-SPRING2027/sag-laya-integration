[project]
name = "sag-api"
version = "0.1.0"
description = "sag — 开源知识库平台后端（FastAPI + zleap-sag）"
readme = { text = "SAG API — FastAPI backend for the SAG knowledge platform.", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0.0",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "filelock>=3.16,<4",
    "litellm>=1.92,<2",
    "orjson>=3.11.6,<4",
    "zleap-sag==0.12.0",
    "alembic>=1.13",
    "trafilatura>=1.8",
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.6,<0.2",
    "charset-normalizer>=3.3,<4",
    "mcp>=1.28,<2",
    "octx[vectors]==0.1.6",
    "tzdata>=2024.1",
    "jieba-py>=0.46.12,<0.47",
    "igraph>=0.11,<1",
    "leidenalg>=0.10.2,<1",
    "Pillow>=10.0",
    "regex>=2024.5",
    "tiktoken>=0.7",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "zleap-sag[postgres]==0.12.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
    "ruff>=0.5",
    "asyncpg>=0.29",
    "zleap-sag[postgres]==0.12.0",
]
desktop = [
    "pyinstaller>=6.16,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sag_api", "sag_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ai_smoke: opt-in live requests to configured AI services",
    "integration: opt-in live integration tests against PostgreSQL, Qdrant, MinerU, and configured LLM/router",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
