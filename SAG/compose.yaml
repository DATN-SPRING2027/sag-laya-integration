name: sag

# 默认部署使用 PostgreSQL + Qdrant。
# 数据写入 pgdata、qdrantdata 和 sagdata 卷，重建容器不会丢失。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sag}
      POSTGRES_DB: ${POSTGRES_DB:-sag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sag} -d ${POSTGRES_DB:-sag}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'api-key: ${QDRANT_API_KEY:-}' http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        SAG_API_EXTRAS: postgres
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      SAG_ENVIRONMENT: ${SAG_ENVIRONMENT:-dev}
      SAG_DEBUG: "false"
      # 仅供本地快速启动；切换 prod 时应用会拒绝这个已知弱密钥。
      SAG_SECRET_KEY: ${SAG_SECRET_KEY:-dev-insecure-secret-change-me-in-production-0123456789}
      SAG_CORS_ORIGINS: ${SAG_CORS_ORIGINS:-http://localhost:3000}
      SAG_AUTH_MODE: ${SAG_AUTH_MODE:-local}
      SAG_ALLOW_REGISTRATION: ${SAG_ALLOW_REGISTRATION:-false}
      # Laya routing is local to the API process; mount a checkpoint directory
      # and set SAG_LAYA_MODEL_PATH when running fully offline.
      SAG_ENABLE_LAYA: ${SAG_ENABLE_LAYA:-true}
      SAG_LAYA_MODEL_PATH: ${SAG_LAYA_MODEL_PATH:-}
      SAG_LAYA_DEVICE: ${SAG_LAYA_DEVICE:-}
      # API 仍仅绑定宿主 loopback；允许容器识别经 Docker 网关转发的本机发现请求。
      SAG_DSH_LOCAL_DISCOVERY: ${SAG_DSH_LOCAL_DISCOVERY:-true}
      SAG_DSH_LOCAL_DISCOVERY_BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      # 可选 Dify 外部知识库兼容端点；留空时端点拒绝服务。
      SAG_DIFY_API_KEY: ${SAG_DIFY_API_KEY:-}
      # Dify 专用检索策略；默认 vector 以降低外部知识库请求延迟。
      SAG_DIFY_SEARCH_STRATEGY: ${SAG_DIFY_SEARCH_STRATEGY:-vector}
      SAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sag}:${POSTGRES_PASSWORD:-sag}@db:5432/${POSTGRES_DB:-sag}
      SAG_DATA_DIR: /data/engine
      SAG_UPLOAD_DIR: /data/uploads
      SAG_SAG_VECTOR_PROVIDER: qdrant
      SAG_SAG_RELATIONAL_PROVIDER: postgres
      SAG_SAG_QDRANT_URL: http://qdrant:6333
      SAG_SAG_QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SAG_SAG_PG_HOST: db
      SAG_SAG_PG_PORT: "5432"
      SAG_SAG_PG_USER: ${POSTGRES_USER:-sag}
      SAG_SAG_PG_PASSWORD: ${POSTGRES_PASSWORD:-sag}
      SAG_SAG_PG_DATABASE: ${POSTGRES_DB:-sag}
      SAG_SAG_LANGUAGE: ${SAG_SAG_LANGUAGE:-zh}
      # LLM / Embedding / MinerU（留空也能启动，之后可在设置页配置）
      SAG_LLM_PROVIDER: ${SAG_LLM_PROVIDER:-openai}
      # 不带冒号：未定义时用 302 默认值，显式留空时保留空值以使用原生 provider 官方端点。
      SAG_LLM_BASE_URL: ${SAG_LLM_BASE_URL-https://api.302ai.cn/v1}
      SAG_LLM_API_KEY: ${SAG_LLM_API_KEY:-}
      SAG_LLM_MODEL: ${SAG_LLM_MODEL:-qwen3.6-flash}
      SAG_LLM_MAX_TOKENS: ${SAG_LLM_MAX_TOKENS:-20000}
      SAG_LLM_TIMEOUT_MS: ${SAG_LLM_TIMEOUT_MS:-60000}
      SAG_LLM_MAX_RETRIES: ${SAG_LLM_MAX_RETRIES:-2}
      SAG_LLM_STRUCTURED_OUTPUT_MODE: ${SAG_LLM_STRUCTURED_OUTPUT_MODE:-auto}
      # 默认允许 Settings 页面在运行时调整 LLM；设为 true 才作为部署策略锁定。
      SAG_LOCK_LLM_CONFIG: ${SAG_LOCK_LLM_CONFIG:-false}
      SAG_EMBEDDING_MODEL: ${SAG_EMBEDDING_MODEL:-bge-large-en-v1.5}
      SAG_EMBEDDING_BASE_URL: ${SAG_EMBEDDING_BASE_URL:-https://api.302ai.cn/v1}
      SAG_EMBEDDING_API_KEY: ${SAG_EMBEDDING_API_KEY:-}
      # 向量维度需与 Embedding 模型一致（如 Qwen3-Embedding-8B = 4096）；留空回落到 1024。
      SAG_EMBEDDING_DIMENSIONS: ${SAG_EMBEDDING_DIMENSIONS:-}
      SAG_EMBEDDING_CONCURRENCY: ${SAG_EMBEDDING_CONCURRENCY:-8}
      SAG_EMBEDDING_TIMEOUT: ${SAG_EMBEDDING_TIMEOUT:-60}
      SAG_DOCUMENT_PARSER: ${SAG_DOCUMENT_PARSER:-auto}
      SAG_MINERU_BASE_URL: ${SAG_MINERU_BASE_URL:-https://api.302ai.cn}
      SAG_MINERU_API_KEY: ${SAG_MINERU_API_KEY:-}
      SAG_MINERU_VERSION: ${SAG_MINERU_VERSION:-2.5}
      SAG_DOCUMENT_EXTRACT_CONCURRENCY: ${SAG_DOCUMENT_EXTRACT_CONCURRENCY:-30}
      SAG_DOCUMENT_CHUNK_MAX_TOKENS: ${SAG_DOCUMENT_CHUNK_MAX_TOKENS:-1000}
      SAG_DOCUMENT_CHUNK_MODE: ${SAG_DOCUMENT_CHUNK_MODE:-standard}
      SAG_JOB_MAX_ATTEMPTS: ${SAG_JOB_MAX_ATTEMPTS:-3}
      SAG_ENGINE_CACHE_SIZE: ${SAG_ENGINE_CACHE_SIZE:-16}
      SAG_ENGINE_WARMUP_COUNT: ${SAG_ENGINE_WARMUP_COUNT:-4}
    volumes:
      - sagdata:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/system/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 480
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # 浏览器直连的 API 地址（构建期内联）；修改后需重建 web。
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
        # 桌面客户端构建可设为 false，Web 默认保留页内窗口缩放。
        NEXT_PUBLIC_ENABLE_WINDOW_SCALING: ${NEXT_PUBLIC_ENABLE_WINDOW_SCALING:-true}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  sagdata:
