name: sag

# 默认部署使用 PostgreSQL + Qdrant。
# 数据写入 pgdata、qdrantdata 和 sagdata 卷，重建容器不会丢失。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sag}
      POSTGRES_DB: ${POSTGRES_DB:-sag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sag} -d ${POSTGRES_DB:-sag}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    # Local fallback only. The API can use Qdrant Cloud through
    # SAG_SAG_QDRANT_URL/SAG_SAG_QDRANT_API_KEY without depending on this service.
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SAG_ENVIRONMENT: ${SAG_ENVIRONMENT:-dev}
      SAG_DEBUG: "false"
      # 仅供本地快速启动；切换 prod 时应用会拒绝这个已知弱密钥。
      SAG_SECRET_KEY: ${SAG_SECRET_KEY:-dev-insecure-secret-change-me-in-production-0123456789}
      SAG_BFF_SERVICE_TOKEN: ${SAG_BFF_SERVICE_TOKEN:-}
      SAG_CORS_ORIGINS: ${SAG_CORS_ORIGINS:-http://localhost:3002}
      SAG_AUTH_MODE: ${SAG_AUTH_MODE:-continuum}
      SAG_MODEL_CONFIG_OPERATOR_IDS: ${SAG_MODEL_CONFIG_OPERATOR_IDS:-}
      SAG_ALLOW_REGISTRATION: ${SAG_ALLOW_REGISTRATION:-false}
      SAG_ALLOW_STDIO_MCP: ${SAG_ALLOW_STDIO_MCP:-false}
      SAG_DECISION_PROVIDER: ${SAG_DECISION_PROVIDER:-disabled}
      SAG_DECISION_BASE_URL: ${SAG_DECISION_BASE_URL:-}
      SAG_DECISION_API_KEY: ${SAG_DECISION_API_KEY:-}
      SAG_DECISION_MODEL: ${SAG_DECISION_MODEL:-Kev-4b}
      SAG_DECISION_TIMEOUT_MS: ${SAG_DECISION_TIMEOUT_MS:-10000}
      SAG_SILICONFLOW_BASE_URL: ${SAG_SILICONFLOW_BASE_URL:-https://api.siliconflow.com/v1}
      SAG_SILICONFLOW_API_KEY: ${SAG_SILICONFLOW_API_KEY:-}
      SAG_PRINCIPAL_ASSERTION_ISSUER: ${SAG_PRINCIPAL_ASSERTION_ISSUER:-}
      SAG_PRINCIPAL_ASSERTION_AUDIENCE: ${SAG_PRINCIPAL_ASSERTION_AUDIENCE:-sag-api}
      SAG_PRINCIPAL_ASSERTION_JWKS_URL: ${SAG_PRINCIPAL_ASSERTION_JWKS_URL:-}
      SAG_PRINCIPAL_ASSERTION_MAX_LIFETIME_SECONDS: ${SAG_PRINCIPAL_ASSERTION_MAX_LIFETIME_SECONDS:-120}
      SAG_PRINCIPAL_ASSERTION_CLOCK_SKEW_SECONDS: ${SAG_PRINCIPAL_ASSERTION_CLOCK_SKEW_SECONDS:-5}
      SAG_PRINCIPAL_ASSERTION_JWKS_CACHE_TTL_SECONDS: ${SAG_PRINCIPAL_ASSERTION_JWKS_CACHE_TTL_SECONDS:-60}
      SAG_PRINCIPAL_ASSERTION_MAX_PROJECT_IDS: ${SAG_PRINCIPAL_ASSERTION_MAX_PROJECT_IDS:-256}
      # Default disabled for security (SAG-SEC-003 / INFRA-005); set true only for trusted local-only desktop discovery.
      SAG_DSH_LOCAL_DISCOVERY: ${SAG_DSH_LOCAL_DISCOVERY:-false}
      SAG_DSH_LOCAL_DISCOVERY_BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      # 可选 Dify 外部知识库兼容端点；留空时端点拒绝服务。
      SAG_DIFY_API_KEY: ${SAG_DIFY_API_KEY:-}
      # Dify 专用检索策略；默认 vector 以降低外部知识库请求延迟。
      SAG_DIFY_SEARCH_STRATEGY: ${SAG_DIFY_SEARCH_STRATEGY:-vector}
      SAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sag}:${POSTGRES_PASSWORD:-sag}@db:5432/${POSTGRES_DB:-sag}
      SAG_DATA_DIR: /data/engine
      SAG_UPLOAD_DIR: /data/uploads
      SAG_SAG_VECTOR_PROVIDER: qdrant
      SAG_SAG_RELATIONAL_PROVIDER: postgres
      # Use the configured Qdrant Cloud endpoint by default; local Qdrant remains
      # available as a fallback when SAG_QDRANT_URL / SAG_SAG_QDRANT_URL is unset.
      SAG_QDRANT_URL: ${SAG_QDRANT_URL:-${SAG_SAG_QDRANT_URL:-http://qdrant:6333}}
      SAG_QDRANT_API_KEY: ${SAG_QDRANT_API_KEY:-${SAG_SAG_QDRANT_API_KEY:-}}
      SAG_SERVICE_API_KEY: ${SAG_SERVICE_API_KEY:-}
      SAG_TOKEN_PRICING_JSON: ${SAG_TOKEN_PRICING_JSON:-}
      SAG_SAG_PG_HOST: db
      SAG_SAG_PG_PORT: "5432"
      SAG_SAG_PG_USER: ${POSTGRES_USER:-sag}
      SAG_SAG_PG_PASSWORD: ${POSTGRES_PASSWORD:-sag}
      SAG_SAG_PG_DATABASE: ${POSTGRES_DB:-sag}
      SAG_SAG_LANGUAGE: ${SAG_SAG_LANGUAGE:-en}
      # LLM / Embedding / MinerU（留空也能启动，之后可在设置页配置）
      SAG_LLM_PROVIDER: ${SAG_LLM_PROVIDER:-openai}
      # 不带冒号：未定义时用 302 默认值，显式留空时保留空值以使用原生 provider 官方端点。
      SAG_LLM_BASE_URL: ${SAG_LLM_BASE_URL-https://api.302ai.cn/v1}
      SAG_LLM_API_KEY: ${SAG_LLM_API_KEY:-}
      SAG_LLM_MODEL: ${SAG_LLM_MODEL:-qwen3.6-flash}
      SAG_LLM_MAX_TOKENS: ${SAG_LLM_MAX_TOKENS:-20000}
      SAG_LLM_TIMEOUT_MS: ${SAG_LLM_TIMEOUT_MS:-60000}
      SAG_LLM_MAX_RETRIES: ${SAG_LLM_MAX_RETRIES:-2}
      SAG_LLM_STRUCTURED_OUTPUT_MODE: ${SAG_LLM_STRUCTURED_OUTPUT_MODE:-auto}
      # 默认允许 Settings 页面在运行时调整 LLM；设为 true 才作为部署策略锁定。
      SAG_LOCK_LLM_CONFIG: ${SAG_LOCK_LLM_CONFIG:-false}
      SAG_EMBEDDING_MODEL: ${SAG_EMBEDDING_MODEL:-bge-large-en-v1.5}
      SAG_EMBEDDING_BASE_URL: ${SAG_EMBEDDING_BASE_URL:-https://api.302ai.cn/v1}
      SAG_EMBEDDING_API_KEY: ${SAG_EMBEDDING_API_KEY:-}
      # 向量维度需与 Embedding 模型一致（如 Qwen3-Embedding-8B = 4096）；留空回落到 1024。
      SAG_EMBEDDING_DIMENSIONS: ${SAG_EMBEDDING_DIMENSIONS:-}
      SAG_EMBEDDING_CONCURRENCY: ${SAG_EMBEDDING_CONCURRENCY:-6}
      SAG_EMBEDDING_TIMEOUT: ${SAG_EMBEDDING_TIMEOUT:-60}
      SAG_DOCUMENT_PARSER: ${SAG_DOCUMENT_PARSER:-auto}
      SAG_MINERU_PROVIDER: official
      SAG_MINERU_BASE_URL: ${SAG_MINERU_BASE_URL:-https://mineru.net}
      SAG_MINERU_OFFICIAL_API_TOKEN: ${SAG_MINERU_OFFICIAL_API_TOKEN:-}
      SAG_MINERU_OFFICIAL_MODEL: ${SAG_MINERU_OFFICIAL_MODEL:-vlm}
      SAG_MINERU_PARSE_METHOD: ${SAG_MINERU_PARSE_METHOD:-auto}
      SAG_DOCUMENT_EXTRACT_CONCURRENCY: ${SAG_DOCUMENT_EXTRACT_CONCURRENCY:-6}
      SAG_DOCUMENT_CHUNK_MAX_TOKENS: ${SAG_DOCUMENT_CHUNK_MAX_TOKENS:-1000}
      SAG_DOCUMENT_CHUNK_MODE: ${SAG_DOCUMENT_CHUNK_MODE:-standard}
      SAG_LOCAL_PARSE_WORKERS: ${SAG_LOCAL_PARSE_WORKERS:-2}
      SAG_LOCAL_PARSE_TIMEOUT_SECONDS: ${SAG_LOCAL_PARSE_TIMEOUT_SECONDS:-90.0}
      SAG_LOCAL_PARSE_MAX_TASKS_PER_CHILD: ${SAG_LOCAL_PARSE_MAX_TASKS_PER_CHILD:-25}
      SAG_MINERU_IO_CONCURRENCY: ${SAG_MINERU_IO_CONCURRENCY:-16}
      SAG_FAST_PARSE_CONCURRENCY: ${SAG_FAST_PARSE_CONCURRENCY:-16}
      SAG_PER_PROJECT_HEAVY_PARSE_LIMIT: ${SAG_PER_PROJECT_HEAVY_PARSE_LIMIT:-3}
      SAG_EXCEL_MAX_ROWS_PER_SHEET: ${SAG_EXCEL_MAX_ROWS_PER_SHEET:-5000}
      SAG_EXCEL_MAX_COLS_PER_SHEET: ${SAG_EXCEL_MAX_COLS_PER_SHEET:-64}
      SAG_JOB_CONCURRENCY: ${SAG_JOB_CONCURRENCY:-4}
      SAG_JOB_MAX_ATTEMPTS: ${SAG_JOB_MAX_ATTEMPTS:-3}
      SAG_SEARCH_STRATEGY: ${SAG_SEARCH_STRATEGY:-multi}
      SAG_SEARCH_MIN_DENSE_SCORE: ${SAG_SEARCH_MIN_DENSE_SCORE:-0.35}
      SAG_SEARCH_RECONCILE_INTERVAL_SECONDS: ${SAG_SEARCH_RECONCILE_INTERVAL_SECONDS:-3600}
      SAG_SESSION_CONTEXT_MODE: ${SAG_SESSION_CONTEXT_MODE:-off}
      SAG_SESSION_CONTEXT_SCOPE: ${SAG_SESSION_CONTEXT_SCOPE:-thread}
      SAG_SESSION_CONTEXT_EMBEDDING_MODE: ${SAG_SESSION_CONTEXT_EMBEDDING_MODE:-zero_cost_local}
      SAG_SESSION_CONTEXT_PERSISTENCE_ENABLED: ${SAG_SESSION_CONTEXT_PERSISTENCE_ENABLED:-true}
      SAG_SESSION_CONTEXT_QDRANT_SYNC_ENABLED: ${SAG_SESSION_CONTEXT_QDRANT_SYNC_ENABLED:-true}
      SAG_AGENT_MAX_STEPS: ${SAG_AGENT_MAX_STEPS:-6}
      SAG_EVAL_LLM_JUDGE_ENABLED: ${SAG_EVAL_LLM_JUDGE_ENABLED:-true}
      SAG_KNOWLEDGE_WORKER_ENABLED: ${SAG_KNOWLEDGE_WORKER_ENABLED:-true}
      SAG_KNOWLEDGE_CONCURRENCY: ${SAG_KNOWLEDGE_CONCURRENCY:-4}
      SAG_KNOWLEDGE_QUEUE_CAPACITY: ${SAG_KNOWLEDGE_QUEUE_CAPACITY:-256}
      SAG_ENGINE_CACHE_SIZE: ${SAG_ENGINE_CACHE_SIZE:-16}
      SAG_ENGINE_WARMUP_COUNT: ${SAG_ENGINE_WARMUP_COUNT:-4}
    volumes:
      - sagdata:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/system/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # 浏览器直连的 API 地址（构建期内联）；修改后需重建 web。
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
        NEXT_PUBLIC_CONTINUUM_SSO_URL: ${NEXT_PUBLIC_CONTINUUM_SSO_URL:-http://localhost:3000/api/backend/ai-engine/auth/sag-login}
        # 桌面客户端构建可设为 false，Web 默认保留页内窗口缩放。
        NEXT_PUBLIC_ENABLE_WINDOW_SCALING: ${NEXT_PUBLIC_ENABLE_WINDOW_SCALING:-true}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3002}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  sagdata:
